<div class="login-page" role="main">
  <article class="login-card">
    <div class="login-card__pattern" aria-hidden="true"></div>
    <div class="login-card__icon" aria-hidden="true">
      <mat-icon>person</mat-icon>
    </div>
    <h1 class="login-card__title">Welcome</h1>
    <p class="login-card__subtitle">Choose how you would like to continue</p>
    <div class="login-card__actions">
      <button type="button" class="login-card__cta login-card__cta--primary" (click)="msalLogin()">
        <span class="login-card__cta-text">Sign in with Microsoft</span>
        <mat-icon class="login-card__cta-arrow" aria-hidden="true">arrow_forward</mat-icon>
      </button>
      <span class="login-card__divider" aria-hidden="true">or</span>
      <button type="button" class="login-card__cta login-card__cta--secondary" (click)="accessKeyLogin()">
        <span class="login-card__cta-text">Continue without login</span>
        <mat-icon class="login-card__cta-arrow" aria-hidden="true">arrow_forward</mat-icon>
      </button>
    </div>
  </article>
</div>
