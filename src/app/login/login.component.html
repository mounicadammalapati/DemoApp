<div class="choice-page" role="main">
  <div class="choice-cards">
    <article class="choice-card choice-card--blue">
      <div class="choice-card__pattern choice-card__pattern--blue" aria-hidden="true"></div>
      <div class="choice-card__icon choice-card__icon--blue" aria-hidden="true">
        <mat-icon>person</mat-icon>
      </div>
      <h2 class="choice-card__title">With Login</h2>
      <p class="choice-card__subtitle">Sign in with your MSAL account</p>
      <button type="button" class="choice-card__cta choice-card__cta--blue" (click)="msalLogin()">
        <span class="choice-card__cta-text">Continue</span>
        <mat-icon class="choice-card__cta-arrow" aria-hidden="true">arrow_forward</mat-icon>
      </button>
    </article>

    <article class="choice-card choice-card--green">
      <div class="choice-card__pattern choice-card__pattern--green" aria-hidden="true"></div>
      <div class="choice-card__icon choice-card__icon--green" aria-hidden="true">
        <mat-icon>gpp_good</mat-icon>
      </div>
      <h2 class="choice-card__title">Without Login</h2>
      <p class="choice-card__subtitle">Continue without signing in</p>
      <button type="button" class="choice-card__cta choice-card__cta--green" (click)="accessKeyLogin()">
        <span class="choice-card__cta-text">Continue</span>
        <mat-icon class="choice-card__cta-arrow" aria-hidden="true">arrow_forward</mat-icon>
      </button>
    </article>
  </div>
</div>
